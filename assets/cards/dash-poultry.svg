<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-label="Dash_Poultry project card">
  <defs>
    <linearGradient id="top-dash-poultry" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-dash-poultry"><rect width="440" height="210" rx="12"/></clipPath>
    <style>
      text{font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace}
      .dsc,.tag,.meta{opacity:0;animation:fin .5s ease forwards}
      @keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      .swipe{animation:sw 3.5s ease-in-out infinite}
      @keyframes sw{0%,100%{opacity:0}50%{opacity:.5}}
    </style>
  </defs>

  <g clip-path="url(#clip-dash-poultry)">
    <rect width="440" height="210" fill="#0a0e14"/>
    <rect width="440" height="3" fill="url(#top-dash-poultry)"/>

    <!-- ambient corner glow -->
    <circle cx="420" cy="24" r="60" fill="#00d9ff" opacity="0.06"/>

    <!-- header -->
    <text x="26" y="46" font-size="22">🐔</text>
    <text x="58" y="46" font-size="19" font-weight="700" fill="#00d9ff">Dash_Poultry</text>

    <!-- repo meta line -->
    <g class="meta" style="animation-delay:.15s" font-size="12" fill="#5c6b7a">
      <circle cx="30" cy="72" r="5" fill="#3572A5"/>
      <text x="42" y="76" fill="#c9d5e1">Python</text>
      <text x="150" y="76">★ 2</text>
      <text x="200" y="76" fill="#5c6b7a">github.com/qm-rajat/Dash_Poultry</text>
    </g>

    <line x1="26" y1="88" x2="414" y2="88" stroke="#00d9ff" stroke-opacity="0.18"/>

    <text class="dsc" x="26" y="112"
      style="animation-delay:0.25s">Desktop farm-management suite: batches,</text>
    <text class="dsc" x="26" y="132"
      style="animation-delay:0.37s">feed/water, vaccination, mortality, payroll,</text>
    <text class="dsc" x="26" y="152"
      style="animation-delay:0.49s">profit/loss analytics with live charts.</text>

    <g class="tag" style="animation-delay:0.7s">
      <rect x="26" y="178" width="96" height="20" rx="4"
        fill="none" stroke="#00d9ff" stroke-opacity="0.6"/>
      <text x="74" y="192" text-anchor="middle"
        font-size="10" fill="#00d9ff">PyQt6</text>
    </g>
    <g class="tag" style="animation-delay:0.7999999999999999s">
      <rect x="130" y="178" width="96" height="20" rx="4"
        fill="none" stroke="#00d9ff" stroke-opacity="0.6"/>
      <text x="178" y="192" text-anchor="middle"
        font-size="10" fill="#00d9ff">SQLite</text>
    </g>
    <g class="tag" style="animation-delay:0.8999999999999999s">
      <rect x="234" y="178" width="96" height="20" rx="4"
        fill="none" stroke="#00d9ff" stroke-opacity="0.6"/>
      <text x="282" y="192" text-anchor="middle"
        font-size="10" fill="#00d9ff">bcrypt</text>
    </g>

    <!-- scan sweep -->
    <rect class="swipe" x="0" y="0" width="440" height="2" fill="#00d9ff">
      <animate attributeName="y" values="90;200;90" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="439" height="209" rx="12"
      fill="none" stroke="#00d9ff" stroke-opacity="0.3"/>
  </g>
</svg>
