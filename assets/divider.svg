<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00ff9c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="14" x2="900" y2="14" stroke="url(#dv)" stroke-width="1.5"/>

  <!-- endpoint node ticks -->
  <line x1="120" y1="8" x2="120" y2="20" stroke="#00d9ff" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="780" y1="8" x2="780" y2="20" stroke="#00d9ff" stroke-opacity="0.5" stroke-width="1"/>

  <!-- packet travelling the wire -->
  <g>
    <rect x="-14" y="10" width="14" height="8" rx="2" fill="#00d9ff" opacity="0.85">
      <animate attributeName="x" values="120;772;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle r="3" cy="14" fill="#ff2e97">
      <animate attributeName="cx" values="120;780;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
