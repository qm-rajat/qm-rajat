<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9c">
        <animate attributeName="stop-color" values="#00ff9c;#00d9ff;#ff2e97;#00ff9c" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#ff2e97;#00ff9c;#00d9ff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="fgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#00ff9c" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="fclip"><rect width="900" height="130" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#fclip)" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace">
    <rect width="900" height="130" fill="#0a0e14"/>
    <rect width="900" height="130" fill="url(#fgrid)"/>
    <rect x="0" y="0" width="900" height="4" fill="url(#fbar)"/>

    <!-- prompt line -->
    <text x="40" y="52" font-size="15" fill="#00d9ff">rajat@parrot</text>
    <text x="150" y="52" font-size="15" fill="#5c6b7a">:</text>
    <text x="158" y="52" font-size="15" fill="#00ff9c">~</text>
    <text x="170" y="52" font-size="15" fill="#5c6b7a">$</text>
    <text x="186" y="52" font-size="15" fill="#c9d5e1">exit</text>
    <rect x="232" y="40" width="9" height="16" fill="#00ff9c">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="40" y="82" font-size="12" fill="#5c6b7a">&#8594; session closed &#183; connection secure &#183; logout 0</text>

    <!-- status chips -->
    <g font-size="11" fill="#0a0e14" font-weight="700">
      <rect x="40"  y="98" width="150" height="20" rx="4" fill="#00ff9c"/>
      <text x="115" y="112" text-anchor="middle">ALWAYS AUTHORIZED</text>
      <rect x="200" y="98" width="128" height="20" rx="4" fill="#00d9ff"/>
      <text x="264" y="112" text-anchor="middle">HACK ETHICALLY</text>
      <rect x="338" y="98" width="112" height="20" rx="4" fill="#ff2e97"/>
      <text x="394" y="112" text-anchor="middle">STAY LEGAL</text>
    </g>

    <text x="860" y="112" text-anchor="end" font-size="11" fill="#5c6b7a">built on a Parrot OS terminal</text>
  </g>
</svg>
