<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="qm-rajat terminal banner">
  <defs>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9c">
        <animate attributeName="stop-color" values="#00ff9c;#00d9ff;#ff2e97;#00ff9c" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#ff2e97;#00ff9c;#00d9ff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00ff9c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#00ff9c" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="clip"><rect width="900" height="340" rx="14"/></clipPath>

    <mask id="m1">
      <rect x="46" y="176" width="0" height="20" fill="#fff">
        <animate attributeName="width" values="0;250;250;250;0" keyTimes="0;0.13;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m2">
      <rect x="46" y="204" width="0" height="20" fill="#fff">
        <animate attributeName="width" values="0;0;640;640;0" keyTimes="0;0.15;0.34;0.93;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m3">
      <rect x="46" y="248" width="0" height="20" fill="#fff">
        <animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.38;0.5;0.94;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m4">
      <rect x="46" y="276" width="0" height="20" fill="#fff">
        <animate attributeName="width" values="0;0;600;600;0" keyTimes="0;0.52;0.72;0.95;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <g clip-path="url(#clip)" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',Consolas,monospace">

    <rect width="900" height="340" fill="#0a0e14"/>
    <rect width="900" height="340" fill="url(#grid)"/>

    <!-- matrix rain -->
    <g opacity="0.45" font-size="12" fill="#00ff9c">
      <text x="770" y="0"><animateTransform attributeName="transform" type="translate" from="0 -160" to="0 400" dur="6.5s" repeatCount="indefinite"/><tspan x="770" dy="0">1</tspan><tspan x="770" dy="15">0</tspan><tspan x="770" dy="15">1</tspan><tspan x="770" dy="15">1</tspan><tspan x="770" dy="15">0</tspan><tspan x="770" dy="15">0</tspan></text>
      <text x="800" y="0"><animateTransform attributeName="transform" type="translate" from="0 -240" to="0 400" dur="8.2s" repeatCount="indefinite"/><tspan x="800" dy="0">0</tspan><tspan x="800" dy="15">1</tspan><tspan x="800" dy="15">1</tspan><tspan x="800" dy="15">0</tspan><tspan x="800" dy="15">1</tspan><tspan x="800" dy="15">0</tspan></text>
      <text x="830" y="0"><animateTransform attributeName="transform" type="translate" from="0 -100" to="0 400" dur="5.4s" repeatCount="indefinite"/><tspan x="830" dy="0">1</tspan><tspan x="830" dy="15">1</tspan><tspan x="830" dy="15">0</tspan><tspan x="830" dy="15">1</tspan><tspan x="830" dy="15">0</tspan><tspan x="830" dy="15">1</tspan></text>
      <text x="860" y="0"><animateTransform attributeName="transform" type="translate" from="0 -300" to="0 400" dur="9.1s" repeatCount="indefinite"/><tspan x="860" dy="0">0</tspan><tspan x="860" dy="15">0</tspan><tspan x="860" dy="15">1</tspan><tspan x="860" dy="15">0</tspan><tspan x="860" dy="15">1</tspan><tspan x="860" dy="15">1</tspan></text>
      <text x="20" y="0"><animateTransform attributeName="transform" type="translate" from="0 -200" to="0 400" dur="7.3s" repeatCount="indefinite"/><tspan x="20" dy="0">1</tspan><tspan x="20" dy="15">0</tspan><tspan x="20" dy="15">0</tspan><tspan x="20" dy="15">1</tspan><tspan x="20" dy="15">1</tspan><tspan x="20" dy="15">0</tspan></text>
    </g>

    <!-- terminal chrome -->
    <rect width="900" height="34" fill="#11161f"/>
    <circle cx="24" cy="17" r="5.5" fill="#ff5f56"/>
    <circle cx="44" cy="17" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="5.5" fill="#27c93f"/>
    <text x="450" y="22" text-anchor="middle" font-size="12" fill="#5c6b7a">rajat@parrot: ~/qm-rajat — zsh</text>

    <!-- title -->
    <text x="450" y="106" text-anchor="middle" font-size="42" font-weight="700" letter-spacing="5" fill="url(#ttl)">RAJAT KUMAR DASH</text>
    <text x="450" y="132" text-anchor="middle" font-size="12" letter-spacing="3.5" fill="#3d4c5c">SEO · PYTHON · WEB · DATA · API</text>

    <line x1="46" y1="150" x2="854" y2="150" stroke="#00ff9c" stroke-opacity="0.18"/>

    <!-- typed block -->
    <g font-size="14">
      <text x="46" y="192" fill="#00d9ff" mask="url(#m1)">rajat@parrot:~$ whoami --full</text>
      <text x="46" y="220" fill="#c9d5e1" mask="url(#m2)">&#8594; Technical SEO · Python Dev · Web Dev · Data Scientist · API Tester</text>
      <text x="46" y="264" fill="#00d9ff" mask="url(#m3)">rajat@parrot:~$ cat .motto</text>
      <text x="46" y="292" fill="#c9d5e1" mask="url(#m4)">&#8594; break it &#8594; learn it &#8594; fix it &#8594; document it &#8594; automate it</text>
    </g>

    <!-- blinking cursor -->
    <rect x="46" y="308" width="9" height="16" fill="#00ff9c">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- scanline sweep -->
    <rect x="0" y="0" width="900" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;340" dur="5s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="none" stroke="#00ff9c" stroke-opacity="0.35"/>
  </g>
</svg>
